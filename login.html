<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem('playora-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}try{if(localStorage.getItem('playora-dir')==='rtl')document.documentElement.setAttribute('dir','rtl');}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Playora</title>
  <meta name="description" content="Log in to your Playora parent account to book play sessions, manage memberships and plan birthday parties.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/redesign.css">
</head>
<body class="auth-page" style="--auth-bg:url('../images/happy.jpg');">
  <main class="auth-main">
    <div class="auth-wrap">
      <a href="index.html" class="logo auth-logo"><span class="logo-mark"><i class="bi bi-balloon-heart-fill"></i></span> Playora</a>
        <div class="card">
          <div class="card-body">
            <h2 style="margin-bottom:0.4rem;">Log In</h2>
            <p style="color:var(--dark-soft); margin-bottom:1.5rem;">Access bookings, memberships &amp; parties.</p>
            <form data-validate action="dashboard.html" method="get">
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required placeholder="you@example.com">
                <div class="form-error">Enter a valid email</div>
              </div>
              <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" required placeholder="••••••••">
                <div class="form-error">Password required</div>
              </div>
              <button type="submit" class="btn btn-primary w-full">Log In</button>
            </form>
            <p class="auth-switch">New to Playora? <a href="signup.html">Create an account</a></p>
          </div>
        </div>
    </div>
  </main>
  <script src="assets/js/main.js"></script>
</body>
</html>
